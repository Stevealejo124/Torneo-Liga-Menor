:root {
  --tinta: #08182e;
  --azul: #0b2545;
  --azul-2: #163a6b;
  --plata: #c3ccd8;
  --plata-osc: #8b97a8;
  --negro: #0d0f12;
  --oro: #f2b705;
  --oro-osc: #c99600;
  --verde: #0b6e3f;
  --verde-claro: #e2f1e7;
  --rojo: #b42318;
  --gris: #5f6b7a;
  --papel: #eeebe3;
  --papel-2: #e5e1d6;
  --blanco: #fff;
  --linea: rgba(11, 37, 69, .14);
  --radio: 6px;
  --titular: "Titular", "Arial Narrow", "Roboto Condensed", system-ui, sans-serif;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  background: var(--papel);
  color: #14202f;
  line-height: 1.45;
}
button { font: inherit; cursor: pointer; color: inherit; }
.contenedor { max-width: 1000px; margin: 0 auto; padding: 0 16px; }
.muted { color: var(--gris); }
:focus-visible { outline: 3px solid var(--oro); outline-offset: 2px; }

/* ---------- Cabecera ---------- */
.cabecera {
  color: #fff;
  background:
    linear-gradient(115deg, transparent 0 62%, rgba(255,255,255,.035) 62% 70%, transparent 70%),
    linear-gradient(180deg, var(--azul) 0%, var(--tinta) 100%);
  border-top: 4px solid var(--oro);
}
.cabecera-inner { display: flex; gap: 18px; align-items: center; padding-top: 22px; padding-bottom: 20px; }
.logo img { display: block; width: auto; height: 104px; filter: drop-shadow(0 6px 10px rgba(0,0,0,.45)); }
.org {
  margin: 0; font-family: var(--titular); font-weight: 700; font-size: 1rem;
  letter-spacing: .22em; text-transform: uppercase; color: var(--oro);
}
.cabecera h1 {
  margin: 2px 0 0; font-family: var(--titular); font-weight: 800; text-transform: uppercase;
  font-size: clamp(2rem, 6vw, 3.4rem); line-height: .92; letter-spacing: .005em;
}
.cabecera h1 .l2 { display: block; color: var(--plata); }
.cabecera h1 .anio { white-space: nowrap; color: var(--oro); }

/* franja negra, como la banda "USULUTAN" del escudo */
.franja { background: var(--negro); border-top: 1px solid rgba(255,255,255,.08); }
.franja-inner {
  display: flex; align-items: center; justify-content: space-between; gap: 10px 18px; flex-wrap: wrap;
  min-height: 40px; padding-top: 8px; padding-bottom: 8px;
  font-family: var(--titular); font-weight: 600; text-transform: uppercase; letter-spacing: .14em; font-size: .88rem;
  color: var(--plata);
}
.franja-jor { display: inline-flex; align-items: center; gap: 12px; letter-spacing: .1em; }
.franja-jor b { color: #fff; font-weight: 800; }
.ticks { display: inline-flex; gap: 3px; }
.ticks i { width: 9px; height: 14px; background: #2a3240; transform: skewX(-14deg); }
.ticks i.ok { background: var(--oro); }

/* ---------- Avisos ---------- */
.aviso { margin-top: 14px; padding: 10px 14px; border-radius: var(--radio); font-size: .9rem; }
.aviso-demo { background: #fff4cc; border: 1px solid #e9c95a; color: #5c4300; }
.aviso-error { background: #fdecea; border: 1px solid #f0b4ad; color: #7d1a10; }
.aviso-error ul { margin: 6px 0 0; padding-left: 18px; }

/* ---------- Navegación ---------- */
.barra { position: sticky; top: 0; z-index: 10; }
.barra-tabs { background: var(--azul); box-shadow: 0 2px 0 rgba(0,0,0,.25); }
.tabs { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; }
.tabs button {
  border: 0; background: transparent; padding: 14px 4px 12px; position: relative;
  font-family: var(--titular); font-weight: 700; font-size: 1.05rem; letter-spacing: .08em; text-transform: uppercase;
  color: var(--plata-osc); transition: color .15s;
}
.tabs button:hover { color: #fff; }
.tabs button[aria-selected="true"] { color: #fff; }
.tabs button[aria-selected="true"]::after {
  content: ""; position: absolute; left: 18%; right: 18%; bottom: 0; height: 4px; background: var(--oro);
}
.barra-cats { background: rgba(238,235,227,.94); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); border-bottom: 1px solid var(--linea); }
.barra-cats.oculto { display: none; }
.cats { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding: 10px 0; }
.cats::-webkit-scrollbar { display: none; }
.cats button {
  flex: 0 0 auto; border: 1.5px solid var(--azul); background: transparent; color: var(--azul);
  padding: 5px 14px 4px; border-radius: 3px;
  font-family: var(--titular); font-weight: 700; font-size: 1rem; letter-spacing: .06em; text-transform: uppercase;
}
.cats button:hover { background: rgba(11,37,69,.06); }
.cats button[aria-pressed="true"] { background: var(--azul); color: #fff; box-shadow: 3px 3px 0 var(--oro); }

main.contenedor { padding-top: 24px; padding-bottom: 40px; min-height: 50vh; }

/* ---------- Bloques y títulos ---------- */
.tarjeta { background: var(--blanco); border: 1px solid var(--linea); border-radius: var(--radio); }
.seccion-titulo { display: flex; align-items: flex-end; justify-content: space-between; gap: 6px 14px; flex-wrap: wrap; margin: 0 0 14px; }
.seccion-titulo h2, .jornada-cab h2, .titulo-bloque {
  margin: 0; font-family: var(--titular); font-weight: 800; text-transform: uppercase;
  color: var(--azul); font-size: clamp(1.5rem, 4.4vw, 2rem); line-height: 1; letter-spacing: .01em;
}
.seccion-titulo h2 .cat, .jornada-cab h2 .cat { color: var(--oro-osc); }
.seccion-titulo .muted { font-size: .88rem; }
.titulo-bloque { display: flex; align-items: center; gap: 10px; font-size: 1.45rem; margin-bottom: 12px; }
.titulo-bloque::before { content: ""; width: 22px; height: 6px; background: var(--oro); transform: skewX(-20deg); }
.titulo-bloque small { font-family: system-ui, sans-serif; text-transform: none; font-weight: 500; font-size: .85rem; color: var(--gris); margin-left: auto; letter-spacing: 0; }

/* ---------- Escudo de cada escuela ---------- */
.escudo {
  flex: 0 0 auto; width: 28px; height: 32px; position: relative;
  border-radius: 4px 4px 50% 50% / 4px 4px 62% 62%;
  display: inline-grid; place-items: center; padding-bottom: 3px;
  color: #fff; font-family: var(--titular); font-weight: 800; font-size: .72rem; letter-spacing: .02em;
  background-image: linear-gradient(180deg, rgba(255,255,255,.22) 0 26%, rgba(0,0,0,0) 26%, rgba(0,0,0,0) 70%, rgba(0,0,0,.14));
  box-shadow: inset 0 0 0 1.5px rgba(255,255,255,.35), 0 1px 0 rgba(0,0,0,.15);
}
.escudo.grande { width: 36px; height: 42px; font-size: .86rem; }
.escudo.con-logo {
  border-radius: 0; padding: 0; box-shadow: none; background-color: transparent;
  background-repeat: no-repeat; background-position: center; background-size: contain;
  filter: drop-shadow(0 1px 0 rgba(0,0,0,.18));
}
.escudo.con-logo.grande { width: 40px; height: 42px; }

/* ---------- Tabla de posiciones ---------- */
.tabla-wrap { overflow-x: auto; }
table.tabla { width: 100%; border-collapse: collapse; font-size: .95rem; }
.tabla thead th {
  background: var(--azul); color: var(--plata);
  font-family: var(--titular); font-weight: 700; font-size: .92rem; letter-spacing: .08em; text-transform: uppercase;
  text-align: center; padding: 10px 6px;
}
.tabla thead th.th-pts { background: var(--oro); color: var(--azul); }
.tabla th.izq, .tabla td.izq { text-align: left; }
.tabla td { text-align: center; padding: 8px 6px; border-bottom: 1px solid #eceae4; font-variant-numeric: tabular-nums; }

.tabla .equipo-celda { display: flex; align-items: center; gap: 10px; min-width: 0; }

.forma { display: inline-flex; gap: 3px; }
.forma i {

}
.forma .G { background: var(--verde); } .forma .E { background: var(--plata-osc); } .forma .P { background: var(--rojo); }
.leyenda { display: flex; gap: 8px 18px; flex-wrap: wrap; font-size: .8rem; color: var(--gris); padding: 11px 16px; border-top: 1px solid var(--linea); background: #faf9f6; }

}

/* ---------- Jornadas / resultados ---------- */
.jornadas-nav { display: flex; align-items: center; gap: 8px; margin-bottom: 18px; }
.jornadas-nav .flecha {

}

.jornadas-lista button {

}

.jornada-cab { display: flex; justify-content: space-between; align-items: flex-end; flex-wrap: wrap; gap: 10px; margin-bottom: 14px; }
.jornada-cab .fecha-j { display: block; margin-top: 4px; font-family: system-ui, sans-serif; text-transform: none; font-size: .88rem; font-weight: 500; color: var(--gris); letter-spacing: 0; }
.interruptor { display: inline-flex; align-items: center; gap: 8px; font-size: .86rem; color: #2b3644; cursor: pointer; user-select: none; }
.interruptor input { width: 38px; height: 22px; appearance: none; -webkit-appearance: none; background: #c5c9cf; border-radius: 99px; position: relative; cursor: pointer; transition: background .2s; margin: 0; }
.interruptor input::after { content: ""; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%; background: #fff; transition: transform .2s; box-shadow: 0 1px 2px rgba(0,0,0,.25); }
.interruptor input:checked { background: var(--azul); }
.interruptor input:checked::after { transform: translateX(16px); }

.partidos { display: grid; gap: 10px; }
@media (min-width: 820px) { .partidos { grid-template-columns: 1fr 1fr; } }
.partido { padding: 12px 14px; }
.partido-meta { font-size: .75rem; color: var(--gris); text-align: center; margin-bottom: 8px; min-height: 1em; text-transform: uppercase; letter-spacing: .06em; }
.partido-fila { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 12px; }
.partido .eq { display: flex; align-items: center; gap: 9px; min-width: 0; font-weight: 650; font-size: .95rem; }
.partido .eq.local { justify-content: flex-end; text-align: right; }
.partido .eq .n { overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.partido .eq.perdio { color: #7b8593; font-weight: 500; }
.marcador {
  min-width: 82px; text-align: center; background: var(--tinta); color: #fff; border-radius: 4px; padding: 5px 10px 3px;
  font-family: var(--titular); font-weight: 800; font-size: 1.75rem; line-height: 1.05; letter-spacing: .04em;
  font-variant-numeric: tabular-nums; box-shadow: inset 0 -3px 0 var(--oro);
}
.marcador .sep { color: var(--oro); margin: 0 .12em; }
.marcador.pendiente { background: var(--papel-2); color: var(--gris); box-shadow: none; font-size: .9rem; line-height: 1.1; padding: 8px 10px; letter-spacing: .08em; }
.marcador.texto { background: #fbe9e7; color: var(--rojo); box-shadow: none; font-size: .9rem; padding: 8px 10px; }
.nota-res { text-align: center; font-size: .74rem; color: var(--rojo); margin-top: 7px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; }
.todas-cats { margin-top: 10px; display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; }
.todas-cats div { background: #f4f2ec; border-radius: 3px; padding: 4px 2px 3px; text-align: center; font-size: .7rem; color: var(--gris); text-transform: uppercase; letter-spacing: .04em; }
.todas-cats div.actual { background: var(--azul); color: var(--plata); }
.todas-cats b { display: block; font-family: var(--titular); font-weight: 800; font-size: 1.05rem; color: #14202f; font-variant-numeric: tabular-nums; letter-spacing: .03em; }
.todas-cats div.actual b { color: #fff; }

.vacio { padding: 40px 20px; text-align: center; color: var(--gris); }
.vacio .icono { font-size: 2rem; display: block; margin-bottom: 6px; }

/* ---------- Playoffs ---------- */
.aviso-proy { background: #fff; border: 1px solid var(--linea); border-left: 5px solid var(--oro); color: #2b3644; padding: 10px 14px; border-radius: var(--radio); font-size: .88rem; margin-bottom: 16px; }
.bracket-wrap { overflow-x: auto; padding-bottom: 6px; }
.bracket { display: grid; grid-template-columns: repeat(3, minmax(220px, 1fr)); gap: 18px; min-width: 700px; }
.ronda h3 {
  margin: 0 0 10px; text-align: center; color: var(--azul);
  font-family: var(--titular); font-weight: 800; font-size: 1.1rem; letter-spacing: .1em; text-transform: uppercase;
}
.ronda-col { display: flex; flex-direction: column; justify-content: space-around; height: calc(100% - 32px); gap: 12px; }
.llave { padding: 0; overflow: hidden; }

  font-family: var(--titular); font-weight: 700; font-size: .82rem; letter-spacing: .08em; text-transform: uppercase;

}
.llave .fila { display: flex; align-items: center; gap: 8px; padding: 8px 12px; font-size: .9rem; }
.llave .fila + .fila { border-top: 1px solid #eceae4; }
.llave .fila .n { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 650; }
.llave .fila .n.por-definir { color: #9aa2ad; font-weight: 500; font-style: italic; }
.llave .fila .seed { font-family: var(--titular); font-weight: 800; font-size: .9rem; color: var(--plata-osc); width: 24px; }
.llave .fila .g { font-family: var(--titular); font-weight: 800; font-size: 1.2rem; color: var(--azul); font-variant-numeric: tabular-nums; }

.llave .fila.gana { background: var(--verde-claro); }

.llave .fila.pierde .n { color: #9aa2ad; }
.llave.final { border: 2px solid var(--oro); box-shadow: 4px 4px 0 var(--oro); }
.llave.final .llave-id { background: var(--oro); color: var(--azul); }
.campeon {
  margin-top: 16px; text-align: center; padding: 20px; border-radius: var(--radio);
  background: var(--tinta); color: #fff; border-top: 5px solid var(--oro);
}

.campeon p { margin: 2px 0; }
.campeon .muted { color: var(--plata); text-transform: uppercase; letter-spacing: .14em; font-size: .8rem; }
.campeon .nombre { font-family: var(--titular); font-weight: 800; font-size: 2rem; text-transform: uppercase; color: var(--oro); }

/* ---------- Reglamento ---------- */
.reglamento { padding: 26px 24px 14px; border-top: 5px solid var(--azul); }
.reglamento h2 { margin: 0; font-family: var(--titular); font-weight: 800; text-transform: uppercase; color: var(--azul); font-size: clamp(1.6rem, 5vw, 2.2rem); line-height: 1; }
.reglamento h3 {
  display: flex; align-items: center; gap: 10px; margin: 26px 0 8px;
  font-family: var(--titular); font-weight: 800; text-transform: uppercase; color: var(--azul); font-size: 1.3rem; letter-spacing: .02em;
}

.chips-lista { list-style: none; padding: 0; display: flex; flex-wrap: wrap; gap: 6px; }
.chips-lista li {
  background: var(--azul); color: #fff; padding: 4px 12px 3px; border-radius: 3px;
  font-family: var(--titular); font-weight: 700; font-size: 1rem; letter-spacing: .06em; text-transform: uppercase;
}
.fases { display: grid; gap: 12px; }
@media (min-width: 720px) { .fases { grid-template-columns: 1fr 1fr; } }
.fase { border: 1px solid var(--linea); border-radius: var(--radio); padding: 14px 16px; background: #faf9f6; }

.fase-num {
  font-family: var(--titular); font-weight: 800; font-size: .85rem; letter-spacing: .12em; text-transform: uppercase;
  color: var(--azul); background: var(--oro); padding: 2px 9px 1px; border-radius: 2px;
}

/* ---------- Pie ---------- */
.pie { background: var(--tinta); color: var(--plata); font-size: .85rem; padding: 22px 0; border-top: 4px solid var(--negro); }
.pie p { margin: 3px 0; }
.pie strong { color: #fff; font-family: var(--titular); font-weight: 800; letter-spacing: .1em; text-transform: uppercase; font-size: 1.05rem; }

/* ==========================================================================
   INICIO
   ========================================================================== */
.portada { display: grid; gap: 14px; }
@media (min-width: 860px) { .portada { grid-template-columns: 1fr 1.15fr; align-items: stretch; } }

/* Cartel de la jornada */
.cartel {
  position: relative; overflow: hidden; padding: 20px 22px 22px;
  background: var(--blanco); border: 1px solid var(--linea); border-top: 6px solid var(--azul); border-radius: var(--radio);
  display: flex; flex-direction: column;
}
.cartel-fase {
  align-self: flex-start; display: inline-flex; align-items: center; gap: 7px;
  font-family: var(--titular); font-weight: 700; text-transform: uppercase; letter-spacing: .14em; font-size: .9rem; color: var(--verde);
}
.cartel-fase i { width: 8px; height: 8px; border-radius: 50%; background: var(--verde); }
.cartel-jornada { display: flex; align-items: flex-end; gap: 12px; margin: 6px 0 2px; }
.cartel-jornada .num {
  font-family: var(--titular); font-weight: 800; font-size: clamp(6rem, 22vw, 8.5rem); line-height: .78; color: var(--azul);
  letter-spacing: -.02em; font-variant-numeric: tabular-nums;
}
.cartel-jornada .txt { font-family: var(--titular); text-transform: uppercase; line-height: 1; padding-bottom: 4px; }
.cartel-jornada .txt b { display: block; font-weight: 800; font-size: 1.9rem; color: var(--azul); letter-spacing: .02em; }
.cartel-jornada .txt span { font-weight: 700; font-size: 1.2rem; color: var(--plata-osc); letter-spacing: .08em; }
.cartel .ticks { margin: 12px 0 6px; gap: 4px; }
.cartel .ticks i { width: auto; flex: 1; height: 10px; background: var(--papel-2); }
.cartel .ticks i.ok { background: var(--oro); }
.cartel .ticks { display: flex; }
.cartel-act { font-size: .86rem; color: var(--gris); margin: 4px 0 0; }
.cartel-botones { display: flex; flex-wrap: wrap; gap: 10px; margin-top: auto; padding-top: 18px; }

.btn-primario, .btn-secundario {
  border-radius: 3px; padding: 11px 18px 10px;
  font-family: var(--titular); font-weight: 800; font-size: 1.08rem; letter-spacing: .08em; text-transform: uppercase;
  transition: transform .12s, box-shadow .12s;
}
.btn-primario { border: 0; background: var(--azul); color: #fff; box-shadow: 4px 4px 0 var(--oro); }
.btn-primario:hover { transform: translate(-1px, -1px); box-shadow: 5px 5px 0 var(--oro); }
.btn-primario:active { transform: translate(2px, 2px); box-shadow: 2px 2px 0 var(--oro); }
.btn-secundario { border: 1.5px solid var(--azul); background: transparent; color: var(--azul); }
.btn-secundario:hover { background: rgba(11,37,69,.06); }

/* Tablero de líderes */
.tablero {
  background: var(--tinta); color: #fff; border-radius: var(--radio); overflow: hidden;
  border: 1px solid #000; display: flex; flex-direction: column;
}
.tablero-cab {
  display: flex; justify-content: space-between; align-items: baseline; gap: 10px;
  padding: 12px 16px 10px; background: var(--negro);
  font-family: var(--titular); text-transform: uppercase;
}
.tablero-cab b { font-weight: 800; font-size: 1.3rem; letter-spacing: .1em; }
.tablero-cab b span { color: var(--oro); }
.tablero-cab small { font-weight: 600; font-size: .85rem; letter-spacing: .12em; color: var(--plata-osc); }
.tablero-lista { display: flex; flex-direction: column; flex: 1; }
.tablero-fila {
  flex: 1; display: grid; grid-template-columns: 74px auto 1fr auto; align-items: center; gap: 12px;
  padding: 9px 16px; border: 0; border-top: 1px solid rgba(255,255,255,.07); background: transparent; color: #fff; text-align: left;
  transition: background .15s;
}
.tablero-fila:hover { background: rgba(255,255,255,.05); }
.tablero-fila .cat { font-family: var(--titular); font-weight: 800; font-size: 1.15rem; letter-spacing: .06em; text-transform: uppercase; color: var(--plata); }
.tablero-fila .n { font-weight: 650; font-size: 1rem; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tablero-fila .n small { display: block; font-weight: 500; font-size: .76rem; color: var(--plata-osc); }
.tablero-fila .pts {
  font-family: var(--titular); font-weight: 800; font-size: 1.9rem; line-height: 1; color: var(--oro); text-align: right; font-variant-numeric: tabular-nums;
}
.tablero-fila .pts small { font-size: .8rem; letter-spacing: .1em; color: var(--plata-osc); margin-left: 3px; }
.tablero-fila .vacio-t { color: var(--plata-osc); font-style: italic; font-size: .9rem; }

/* Categorías como números de camiseta */
.bloque { margin-top: 30px; }
.inicio-cats { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; }
.cat-tile {
  border: 1.5px solid var(--azul); background: var(--blanco); border-radius: var(--radio); padding: 12px 6px 10px;
  display: flex; flex-direction: column; align-items: center; gap: 0; color: var(--azul);
  transition: transform .12s, box-shadow .12s, background .12s;
}
.cat-tile .sub { font-family: var(--titular); font-weight: 700; font-size: .95rem; letter-spacing: .3em; text-transform: uppercase; color: var(--plata-osc); padding-left: .3em; }
.cat-tile .num { font-family: var(--titular); font-weight: 800; font-size: 3.4rem; line-height: .95; }
.cat-tile .ver { font-size: .76rem; font-weight: 700; color: var(--verde); margin-top: 2px; }
.cat-tile:hover { transform: translate(-2px, -2px); box-shadow: 4px 4px 0 var(--azul); }
@media (max-width: 600px) {
  .inicio-cats { grid-template-columns: repeat(5, 1fr); gap: 6px; }
  .cat-tile { padding: 9px 2px 8px; }
  .cat-tile .sub { font-size: .72rem; letter-spacing: .14em; padding-left: .14em; }
  .cat-tile .num { font-size: 2.4rem; }
  .cat-tile .ver { display: none; }
}

/* Cifras del torneo */
.cifras { display: grid; grid-template-columns: repeat(4, 1fr); background: var(--azul); border-radius: var(--radio); overflow: hidden; }
.cifras div { padding: 14px 8px 12px; text-align: center; color: var(--plata); border-left: 1px solid rgba(255,255,255,.1); }
.cifras div:first-child { border-left: 0; }

.cifras span { font-family: var(--titular); font-weight: 600; text-transform: uppercase; letter-spacing: .12em; font-size: .85rem; }
@media (max-width: 520px) {
  .cifras { grid-template-columns: repeat(2, 1fr); }

  .cifras div:nth-child(n+3) { border-top: 1px solid rgba(255,255,255,.1); }
}

/* Escuelas participantes */
.escuelas { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 0; padding: 4px 0; }
.escuela { display: flex; align-items: center; gap: 10px; padding: 9px 14px; font-weight: 650; font-size: .95rem; border-bottom: 1px solid #eceae4; }
@media (max-width: 480px) { .escuelas { grid-template-columns: 1fr 1fr; } .escuela { padding: 8px 10px; font-size: .86rem; gap: 8px; } }

/* ---------- Anuncios (al final de cada sección) ---------- */
.anuncios { display: grid; gap: 12px; margin: 38px 0 6px; padding-top: 22px; border-top: 1px solid var(--linea); }
@media (min-width: 760px) { .anuncios { grid-template-columns: 1fr 1fr; } }
.anuncio {
  position: relative; display: flex; gap: 14px; align-items: flex-start; padding: 18px 18px 16px; border-radius: var(--radio);
  text-decoration: none; color: inherit; transition: transform .12s ease, box-shadow .12s ease; overflow: hidden;
}
.anuncio:hover { transform: translate(-2px, -2px); box-shadow: 4px 4px 0 rgba(11,37,69,.25); }
.anuncio-tag { position: absolute; top: 9px; right: 12px; font-size: 10.5px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; opacity: .6; }
.anuncio-ico { flex: 0 0 auto; width: 58px; height: 58px; border-radius: 4px; display: grid; place-items: center; }
.anuncio-cuerpo { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.anuncio-marca { font-size: 12px; font-weight: 700; letter-spacing: .03em; padding-right: 64px; }
.anuncio-tit { font-family: var(--titular); font-weight: 800; font-size: 1.45rem; line-height: 1.05; text-transform: uppercase; letter-spacing: .01em; }
.anuncio-txt { font-size: 14px; line-height: 1.45; opacity: .88; }
.anuncio-btn {
  align-self: flex-start; margin-top: 8px; padding: 6px 14px 5px; border-radius: 3px;
  font-family: var(--titular); font-weight: 800; font-size: 1rem; letter-spacing: .08em; text-transform: uppercase;
}
.anuncio-retro { color: #fff; background:
  repeating-linear-gradient(90deg, rgba(255,255,255,.035) 0 28px, transparent 28px 56px),
  linear-gradient(135deg, #0a3d24 0%, #0b2545 100%); }
.anuncio-retro .anuncio-ico { background: #0b6e3f; box-shadow: inset 0 0 0 3px rgba(255,255,255,.15); }
.anuncio-retro .anuncio-marca { color: var(--oro); font-family: ui-monospace, "Courier New", monospace; text-transform: uppercase; letter-spacing: .06em; }
.anuncio-retro .anuncio-tit { font-family: ui-monospace, "Courier New", monospace; font-size: 1.2rem; letter-spacing: .02em; }
.anuncio-retro .anuncio-btn { background: var(--oro); color: var(--azul); }
.anuncio-claro { background: var(--blanco); border: 1px solid var(--linea); }
.anuncio-claro .anuncio-ico { background: var(--papel); color: var(--azul); }
.anuncio-claro .anuncio-marca { color: var(--verde); }
.anuncio-claro .anuncio-tit { color: var(--azul); }
.anuncio-claro .anuncio-btn { background: var(--azul); color: #fff; }

/* ==========================================================================
   QUINIELA
   ========================================================================== */
.q-caja { background: var(--blanco); border: 1px solid var(--linea); border-left: 5px solid var(--oro); border-radius: var(--radio); padding: 16px 18px; }
.q-caja b { font-family: var(--titular); font-weight: 800; text-transform: uppercase; font-size: 1.2rem; color: var(--azul); letter-spacing: .02em; }
.q-caja p { margin: 4px 0 0; color: #2b3644; }
.q-caja small { display: block; margin-top: 6px; color: var(--gris); }
.q-reglas { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0; background: var(--azul); color: var(--plata); border-radius: var(--radio); overflow: hidden; margin-bottom: 14px; }
.q-reglas div { display: flex; gap: 10px; align-items: center; padding: 12px 14px; border-left: 1px solid rgba(255,255,255,.1); font-size: .9rem; line-height: 1.3; }
.q-reglas div:first-child { border-left: 0; }
.q-reglas b { flex: 0 0 auto; width: 30px; height: 30px; display: grid; place-items: center; background: var(--oro); color: var(--azul); font-family: var(--titular); font-weight: 800; font-size: 1.15rem; border-radius: 3px; }
.q-reglas strong { color: #fff; }
@media (max-width: 700px) { .q-reglas { grid-template-columns: 1fr; } .q-reglas div { border-left: 0; border-top: 1px solid rgba(255,255,255,.1); } .q-reglas div:first-child { border-top: 0; } }
.q-error { background: #fdecea; border: 1px solid #f0b4ad; color: #7d1a10; padding: 9px 12px; border-radius: var(--radio); font-size: .9rem; margin: 0 0 12px; }

.q-sesion, .q-apodo { display: flex; align-items: center; justify-content: space-between; gap: 12px 18px; flex-wrap: wrap;
  background: var(--blanco); border: 1px solid var(--linea); border-top: 5px solid var(--azul); border-radius: var(--radio); padding: 14px 16px; }
.q-sesion > div:first-child, .q-apodo label { display: flex; flex-direction: column; gap: 2px; }
.q-sesion b, .q-apodo label b { font-family: var(--titular); font-weight: 800; font-size: 1.35rem; text-transform: uppercase; color: var(--azul); line-height: 1.05; }
.q-sesion span, .q-apodo label span { font-size: .86rem; color: var(--gris); }
.q-sesion-on b { color: var(--azul); }
.q-sesion-acc { display: flex; gap: 14px; }
.q-link { border: 0; background: none; padding: 4px 0; color: var(--azul); font-weight: 700; font-size: .88rem; text-decoration: underline; text-underline-offset: 3px; }
.q-google { display: inline-flex; align-items: center; gap: 10px; border: 1.5px solid #c9ccd2; background: #fff; color: #1f1f1f;
  border-radius: 999px; padding: 9px 18px 9px 14px; font-weight: 700; font-size: .95rem; box-shadow: 0 1px 2px rgba(0,0,0,.08); }
.q-google:hover { background: #f6f7f9; }
.q-apodo { flex-direction: column; align-items: stretch; }
.q-apodo-fila { display: flex; gap: 10px; flex-wrap: wrap; }
.q-apodo input { flex: 1 1 200px; min-width: 0; font: inherit; font-size: 1.05rem; padding: 10px 12px; border: 1.5px solid var(--azul); border-radius: 3px; background: #fff; }
.q-llamar { animation: q-llamar .9s ease 1; }
@keyframes q-llamar { 0%, 100% { box-shadow: none; } 30% { box-shadow: 0 0 0 4px var(--oro); } }

.q-bloque { margin-top: 26px; }
.q-jornada-cab { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 4px 14px; margin-bottom: 4px; }
.q-jornada-cab .titulo-bloque { margin-bottom: 0; }
.q-abierta { font-family: var(--titular); font-size: .85rem; letter-spacing: .1em; background: var(--verde); color: #fff; padding: 2px 8px 1px; border-radius: 2px; }
.q-cierre { margin: 0; font-size: .9rem; color: #2b3644; }
.q-ayuda { font-size: .88rem; color: var(--gris); margin: 6px 0 12px; }
.q-guardado { display: inline-block; margin-left: 6px; font-weight: 700; color: var(--verde); }
.q-partidos { display: grid; gap: 10px; }
@media (min-width: 820px) { .q-partidos { grid-template-columns: 1fr 1fr; } }
.q-partido { padding: 0 0 6px; overflow: hidden; }
.q-partido-cab { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px; padding: 10px 12px; background: #faf9f6; border-bottom: 1px solid #eceae4; margin-bottom: 4px; }
.q-partido-cab .eq { display: flex; align-items: center; gap: 8px; min-width: 0; }
.q-partido-cab .eq b { font-size: .92rem; line-height: 1.15; }
.q-partido-cab .eq-v { justify-content: flex-end; text-align: right; }
.q-partido-cab .vs { font-family: var(--titular); font-weight: 800; color: var(--plata-osc); text-transform: uppercase; letter-spacing: .08em; }
.q-fila { display: grid; grid-template-columns: 62px 1fr 1fr 1fr; gap: 5px; align-items: center; padding: 4px 12px; }
.q-cat { font-family: var(--titular); font-weight: 800; font-size: 1rem; color: var(--azul); text-transform: uppercase; letter-spacing: .04em; }
.q-op { border: 1.5px solid #cfd3da; background: #fff; border-radius: 3px; padding: 8px 4px 7px; min-height: 40px;
  font-family: var(--titular); font-weight: 700; font-size: 1rem; letter-spacing: .05em; text-transform: uppercase; color: #39424f; transition: background .12s, border-color .12s; }
.q-op:hover { border-color: var(--azul); }
.q-op[aria-pressed="true"] { background: var(--azul); border-color: var(--azul); color: #fff; box-shadow: inset 0 -3px 0 var(--oro); }
.q-op[data-bloq] { opacity: .55; }

.q-mis { margin-bottom: 8px; }
.q-mis summary { display: flex; justify-content: space-between; gap: 10px; padding: 11px 14px; cursor: pointer; list-style: none; }
.q-mis summary::-webkit-details-marker { display: none; }
.q-mis summary b { font-family: var(--titular); font-weight: 800; text-transform: uppercase; color: var(--azul); font-size: 1.1rem; }
.q-mis summary span { color: var(--gris); font-size: .88rem; }
.q-mis ul { list-style: none; margin: 0; padding: 0 0 6px; border-top: 1px solid #eceae4; }
.q-mis li { display: grid; grid-template-columns: 58px 1fr auto 24px; gap: 8px; align-items: center; padding: 6px 14px; font-size: .88rem; border-bottom: 1px solid #f2f0ea; }
.q-mis li:empty { display: none; }
.q-mis li i { font-style: normal; font-weight: 800; text-align: center; }
.q-mis li.ok i { color: var(--verde); } .q-mis li.mal i { color: var(--rojo); } .q-mis li.pend i { color: var(--plata-osc); }
.q-mis li .q-m { color: var(--gris); }
.q-mis li .q-e { font-weight: 650; }

.q-vistas { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
.q-vistas button { border: 1.5px solid var(--azul); background: transparent; color: var(--azul); padding: 4px 12px 3px; border-radius: 3px;
  font-family: var(--titular); font-weight: 700; font-size: .98rem; letter-spacing: .06em; text-transform: uppercase; }
.q-vistas button[aria-pressed="true"] { background: var(--azul); color: #fff; box-shadow: 3px 3px 0 var(--oro); }
.q-tabla tr.yo td { background: #fff6d6 !important; font-weight: 700; }
.q-tabla tr.top1 td.pos { color: var(--oro-osc); } .q-tabla tr.top2 td.pos { color: #8b97a8; } .q-tabla tr.top3 td.pos { color: #b0703a; }
.q-tabla tr.sep td { text-align: center; color: var(--plata-osc); padding: 2px; }
.q-tabla td small { color: var(--gris); font-weight: 500; }
.q-quitar { border: 0; background: none; color: var(--rojo); font-weight: 800; margin-left: 6px; padding: 0 4px; }
.q-admin .tarjeta { padding: 12px 16px; font-size: .9rem; border-left: 5px solid var(--oro); }
.q-admin ul { padding-left: 18px; margin: 8px 0; }
.q-admin code { background: var(--papel); padding: 1px 5px; border-radius: 3px; }
.q-est { font-weight: 700; color: var(--azul); }

/* Aviso de quiniela en Inicio */
.q-promo { display: flex; align-items: center; justify-content: space-between; gap: 10px 16px; flex-wrap: wrap; margin-top: 14px;
  background: var(--oro); color: var(--azul); border-radius: var(--radio); padding: 12px 16px; border: 0; width: 100%; text-align: left; }
.q-promo b { font-family: var(--titular); font-weight: 800; font-size: 1.35rem; text-transform: uppercase; line-height: 1.05; display: block; }
.q-promo span { font-size: .9rem; }
.q-promo .ir { font-family: var(--titular); font-weight: 800; text-transform: uppercase; letter-spacing: .08em; background: var(--azul); color: #fff; padding: 8px 14px 7px; border-radius: 3px; white-space: nowrap; }

/* Avisos (notificaciones) en Inicio */
.avisos { display: flex; align-items: center; gap: 12px 14px; flex-wrap: wrap; margin-top: 10px;
  background: var(--blanco); border: 1px solid var(--linea); border-left: 5px solid var(--azul-2); border-radius: var(--radio); padding: 11px 14px; }
.avisos .av-campana { position: relative; flex: none; width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center;
  background: var(--azul); color: var(--oro); }
.avisos .av-campana i { position: absolute; top: 6px; right: 7px; width: 9px; height: 9px; border-radius: 50%; background: #2fd47c; box-shadow: 0 0 0 2px var(--azul); }
.avisos .av-txt { flex: 1 1 200px; min-width: 0; font-size: .9rem; color: var(--gris); line-height: 1.35; }
.avisos .av-txt b { display: block; font-family: var(--titular); font-weight: 800; text-transform: uppercase; letter-spacing: .03em; font-size: 1.1rem; color: var(--azul); line-height: 1.1; margin-bottom: 1px; }
.avisos .av-btn { font-family: var(--titular); font-weight: 800; text-transform: uppercase; letter-spacing: .08em; font-size: .95rem;
  background: var(--azul); color: #fff; border: 0; border-radius: 3px; padding: 9px 14px 8px; white-space: nowrap; cursor: pointer; }
.avisos .av-btn:disabled { opacity: .6; cursor: progress; }
.avisos .av-quitar { background: none; border: 0; color: var(--gris); text-decoration: underline; font-size: .85rem; cursor: pointer; padding: 6px 2px; }
.avisos.av-activos { border-left-color: var(--verde); }
.avisos.av-bloqueado { border-left-color: var(--plata-osc); }

/* ---------- Ajustes para celular ---------- */
.partido-meta:empty { display: none; }
@media (max-width: 480px) {
  .contenedor { padding: 0 12px; }
  .logo img { height: 80px; }
  .cabecera-inner { gap: 12px; padding-top: 16px; padding-bottom: 14px; }
  .org { font-size: .82rem; letter-spacing: .16em; }
  .franja-inner { font-size: .74rem; letter-spacing: .1em; justify-content: center; }
  .franja-txt { display: none; }
  .tabs button { font-size: .86rem; letter-spacing: .03em; padding: 13px 2px 11px; }
  .tabs.con-6 button { font-size: .76rem; letter-spacing: .01em; }
  .q-fila { grid-template-columns: 50px 1fr 1fr 1fr; padding: 4px 8px; gap: 4px; }
  .q-op { font-size: .92rem; padding: 8px 2px 7px; }

  .partido .eq { flex-direction: column; text-align: center; gap: 4px; font-size: .85rem; }

  .anuncio { padding: 16px 14px 14px; gap: 12px; }

}
@media (max-width: 700px) {
  .bracket { grid-template-columns: 1fr; min-width: 0; gap: 22px; }
  .ronda-col { height: auto; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition: none !important; }
}

/* ------------------------------------------------------------------ */
/* Contador hacia la próxima jornada (marcador de estadio)            */
/* ------------------------------------------------------------------ */
.cuenta {
  margin-top: 14px; padding: 16px 18px 18px; border-radius: var(--radio);
  background: var(--tinta); color: #fff; border: 1px solid #000; border-bottom: 6px solid var(--oro);
  display: grid; gap: 12px; position: relative; overflow: hidden;
}
.cuenta::after { /* líneas de cancha muy tenues */
  content: ""; position: absolute; right: -60px; top: -60px; width: 220px; height: 220px; border-radius: 50%;
  border: 2px solid rgba(255,255,255,.06); box-shadow: 0 0 0 38px rgba(255,255,255,.025); pointer-events: none;
}
.cuenta-espera { border-bottom-color: var(--verde); }
.cuenta-cab { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; font-family: var(--titular); text-transform: uppercase; }
.cuenta-tit { font-weight: 700; letter-spacing: .16em; font-size: .95rem; color: var(--oro); }
.cuenta-num { font-weight: 800; font-size: 1.5rem; letter-spacing: .04em; color: var(--plata); }
.cuenta-reloj { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.cuenta-reloj .dig {
  background: var(--negro); border: 1px solid rgba(255,255,255,.08); border-radius: 4px; padding: 10px 4px 8px; text-align: center;
  box-shadow: inset 0 -18px 0 rgba(255,255,255,.025);
}
.cuenta-reloj b {
  display: block; font-family: var(--titular); font-weight: 800; font-size: clamp(2.4rem, 11vw, 3.6rem); line-height: .95;
  color: var(--oro); font-variant-numeric: tabular-nums; letter-spacing: .01em;
}
.cuenta-reloj span { font-family: var(--titular); font-weight: 700; text-transform: uppercase; letter-spacing: .14em; font-size: .78rem; color: var(--plata-osc); }
.cuenta-fecha { margin: 0; font-size: .95rem; color: var(--plata); }
.cuenta-fecha::first-letter { text-transform: uppercase; }
.cuenta-cruces { display: flex; flex-wrap: wrap; gap: 6px; }
.cuenta-cruce {
  display: inline-flex; align-items: center; gap: 4px; padding: 4px 7px; border-radius: 3px;
  background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.08);
}
.cuenta-cruce i { font-style: normal; font-family: var(--titular); font-weight: 700; font-size: .72rem; color: var(--plata-osc); text-transform: uppercase; }
.cuenta-ver {
  justify-self: start; border: 0; background: var(--oro); color: var(--tinta); border-radius: 3px; padding: 10px 16px 9px;
  font-family: var(--titular); font-weight: 800; font-size: 1.02rem; letter-spacing: .08em; text-transform: uppercase;
}
.cuenta-ver:hover { background: #ffc81f; }
.cuenta-nota { margin: 0; font-size: .86rem; color: var(--plata); }
.cuenta-vivo { display: flex; align-items: center; gap: 12px; padding: 14px 0 6px; font-family: var(--titular); text-transform: uppercase; }
.cuenta-vivo b { font-weight: 800; font-size: clamp(1.8rem, 8vw, 2.6rem); letter-spacing: .03em; }
.cuenta-vivo .punto, .franja-cuenta.vivo i, .mini-cuenta.vivo i {
  width: 14px; height: 14px; border-radius: 50%; background: #e5372b; flex: none; animation: latido 1.2s ease-in-out infinite;
}
@keyframes latido { 0%, 100% { box-shadow: 0 0 0 0 rgba(229,55,43,.6); } 50% { box-shadow: 0 0 0 7px rgba(229,55,43,0); } }
@media (prefers-reduced-motion: reduce) { .cuenta-vivo .punto, .franja-cuenta.vivo i, .mini-cuenta.vivo i { animation: none; } }

.franja-cuenta { display: inline-flex; align-items: center; gap: 7px; padding-left: 18px; border-left: 1px solid rgba(255,255,255,.15); letter-spacing: .1em; white-space: nowrap; }
.franja-cuenta b { color: var(--oro); font-weight: 800; font-variant-numeric: tabular-nums; }
.franja-cuenta.vivo i { width: 9px; height: 9px; }
@media (max-width: 600px) { .franja-cuenta { padding-left: 0; border-left: 0; } .franja-inner { row-gap: 4px; } }

.mini-cuenta {
  display: flex; align-items: center; gap: 8px; margin-bottom: 10px; padding: 10px 14px; border-radius: var(--radio);
  background: var(--tinta); color: var(--plata); font-size: .95rem;
}
.mini-cuenta b { color: var(--oro); font-family: var(--titular); font-weight: 800; font-size: 1.15rem; letter-spacing: .04em; font-variant-numeric: tabular-nums; }
.mini-cuenta.vivo i { width: 10px; height: 10px; }

/* Turnos por categoría dentro del contador */
.cuenta-turnos { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 6px; }
.turno {
  display: grid; grid-template-columns: 1fr; gap: 1px; padding: 8px 10px; border-radius: 4px;
  background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.08); border-left: 3px solid var(--plata-osc);
}
.turno .t-hora { font-family: var(--titular); font-weight: 800; font-size: 1.15rem; color: #fff; letter-spacing: .03em; white-space: nowrap; }
.turno .t-cats { font-family: var(--titular); font-weight: 700; text-transform: uppercase; letter-spacing: .08em; font-size: .9rem; color: var(--plata); }
.turno .t-est { grid-column: 1 / -1; font-size: .8rem; color: var(--plata-osc); }
.turno .t-est b { color: var(--oro); font-variant-numeric: tabular-nums; }
.turno.ya { border-left-color: var(--verde); opacity: .75; }
.turno.ya .t-est { color: #7fd3a4; }
.turno.sig { border-left-color: var(--oro); background: rgba(242,183,5,.1); }

/* ------------------------------------------------------------------ */
/* ¿Te gustaría apoyarnos?                                            */
/* ------------------------------------------------------------------ */
.pista-escudo { margin: 10px 2px 0; font-size: .9rem; color: var(--gris); }
.pista-escudo a, .pie-apoyo a { color: inherit; font-weight: 700; text-decoration: underline; text-decoration-color: var(--oro); text-decoration-thickness: 2px; text-underline-offset: 3px; }
.pie-apoyo { margin-top: 10px !important; }
.pie-apoyo a { color: var(--oro); text-decoration: none; font-family: var(--titular); font-weight: 800; letter-spacing: .08em; text-transform: uppercase; font-size: .98rem; }

.apoyo {
  position: relative; overflow: hidden; scroll-margin-top: 70px;
  background: var(--blanco); border: 1px solid var(--linea); border-radius: var(--radio);
  display: grid; grid-template-columns: 1fr; gap: 0;
}
@media (min-width: 860px) { .apoyo { grid-template-columns: minmax(260px, .9fr) 1.6fr; } }
.apoyo-cab {
  position: relative; padding: 22px 22px 20px; background: var(--azul); color: #fff;
  background-image: repeating-linear-gradient(90deg, rgba(255,255,255,.035) 0 34px, transparent 34px 68px);
}
.apoyo-cab::after { /* cinta dorada, como la del escudo */
  content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 6px; background: var(--oro);
}
@media (min-width: 860px) { .apoyo-cab { grid-row: span 3; } .apoyo-cab::after { left: auto; top: 0; width: 6px; height: auto; } }
.apoyo-sobre { font-family: var(--titular); font-weight: 700; letter-spacing: .18em; text-transform: uppercase; font-size: .88rem; color: var(--oro); }
.apoyo-cab h3 {
  margin: 4px 0 10px; font-family: var(--titular); font-weight: 800; text-transform: uppercase;
  font-size: clamp(2rem, 8vw, 2.6rem); line-height: .95; letter-spacing: .01em;
}
.apoyo-cab p { margin: 0; color: var(--plata); font-size: .95rem; }

.apoyo-lista { display: grid; grid-template-columns: 1fr; }
@media (min-width: 560px) { .apoyo-lista { grid-template-columns: 1fr 1fr; } }
.apoyo-op {
  display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 12px;
  padding: 14px 16px; color: inherit; text-decoration: none;
  border-bottom: 1px solid var(--linea); transition: background .12s;
}
@media (min-width: 560px) { .apoyo-op:nth-child(odd) { border-right: 1px solid var(--linea); } }
.apoyo-op:hover, .apoyo-op:focus-visible { background: #f7f5ef; }
.apoyo-ico {
  width: 44px; height: 44px; display: grid; place-items: center; border-radius: 4px;
  background: var(--papel); color: var(--azul); box-shadow: inset 0 -3px 0 var(--oro);
}
.apoyo-txt b { display: block; font-family: var(--titular); font-weight: 800; text-transform: uppercase; letter-spacing: .04em; font-size: 1.12rem; color: var(--azul); line-height: 1.1; }
.apoyo-txt small { display: block; color: var(--gris); font-size: .84rem; margin-top: 2px; }
.apoyo-ir { font-family: var(--titular); font-weight: 800; font-size: 1.5rem; color: var(--oro-osc); }

.apoyo-correo {
  display: flex; align-items: center; justify-content: space-between; gap: 10px 14px; flex-wrap: wrap;
  padding: 14px 16px; background: var(--papel);
}
.apoyo-correo-txt small { display: block; font-size: .78rem; color: var(--gris); text-transform: uppercase; letter-spacing: .1em; }
.apoyo-correo-txt b { font-size: 1.02rem; color: var(--tinta); word-break: break-all; }
.apoyo-copiar {
  border: 1.5px solid var(--azul); background: var(--blanco); color: var(--azul); border-radius: 3px; padding: 8px 14px 7px;
  font-family: var(--titular); font-weight: 800; letter-spacing: .08em; text-transform: uppercase; font-size: .95rem;
}
.apoyo-copiar.ok { background: var(--verde); border-color: var(--verde); color: #fff; }
.apoyo-nota { margin: 0; padding: 0 16px 14px; background: var(--papel); font-size: .8rem; color: var(--gris); }

/* ------------------------------------------------------------------ */
/* Cortina "wipe" entre pestañas                                      */
/* ------------------------------------------------------------------ */
.wipe-container {
  position: fixed; inset: 0; z-index: 9999;
  display: grid; place-items: center;
  visibility: hidden; pointer-events: none;
}
.wipe-container.is-active { visibility: visible; pointer-events: auto; }   /* bloquea toques mientras anima */
.wipe-bars { position: absolute; inset: 0; display: flex; }
.wipe-bars .bar {
  flex: 1; background-color: var(--azul);
  transform: scaleY(0); transform-origin: bottom;
  transition: transform .4s cubic-bezier(.8, 0, .2, 1);
  will-change: transform;
}
.wipe-bars .bar:nth-child(even) { background-color: var(--oro); }
/* escalonadas: entran y salen una tras otra, de izquierda a derecha */
.wipe-bars .bar:nth-child(2) { transition-delay: .03s; }
.wipe-bars .bar:nth-child(3) { transition-delay: .06s; }
.wipe-bars .bar:nth-child(4) { transition-delay: .09s; }
.wipe-bars .bar:nth-child(5) { transition-delay: .12s; }

.wipe-label {
  position: relative; z-index: 10; text-align: center;
  padding: 14px 26px 12px; background: var(--tinta); color: #fff;
  border-bottom: 6px solid var(--oro); box-shadow: 8px 8px 0 rgba(0,0,0,.25);
  opacity: 0; transform: scale(.8);
  transition: opacity .25s ease-out, transform .25s ease-out;
}
.wipe-label small {
  display: block; font-family: var(--titular); font-weight: 700; text-transform: uppercase;
  letter-spacing: .2em; font-size: .85rem; color: var(--oro);
}
.wipe-label h2 {
  margin: 2px 0 0; font-family: var(--titular); font-weight: 800; text-transform: uppercase;
  font-size: clamp(2.4rem, 11vw, 4.2rem); line-height: .95; letter-spacing: .02em;
}
.wipe-container.cover .bar { transform: scaleY(1); }
.wipe-container.cover .wipe-label { opacity: 1; transform: scale(1); transition-delay: .2s; }
.wipe-container.leave .bar { transform-origin: top; transform: scaleY(0); }
.wipe-container.leave .wipe-label { opacity: 0; transform: scale(.8); transition-delay: 0s; }
@media (prefers-reduced-motion: reduce) { .wipe-container { display: none; } }

.redes-cab { display: flex; gap: 14px; align-items: center; }
.redes-logo { flex: none; filter: drop-shadow(0 4px 10px rgba(0,0,0,.35)); }
.redes-sobre { font-family: var(--titular); font-weight: 800; letter-spacing: .22em; text-transform: uppercase; font-size: .78rem; color: var(--oro); }
.redes h3 { margin: 2px 0 4px; font-family: var(--titular); font-weight: 800; font-size: 1.45rem; line-height: 1.05; text-transform: uppercase; letter-spacing: .02em; }
.redes p { margin: 0; color: var(--plata); font-size: .88rem; }
.redes-botones { display: grid; gap: 10px; position: relative; z-index: 1; }
.red-btn { display: grid; grid-template-columns: 44px minmax(0, 1fr) auto; align-items: center; gap: 12px; padding: 10px 14px 10px 10px; border-radius: var(--radio); background: #fff; color: var(--tinta); text-decoration: none; transition: transform .2s, box-shadow .2s; }
.red-btn:hover, .red-btn:focus-visible { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(0,0,0,.28); }
.red-ico { width: 44px; height: 44px; border-radius: 10px; display: grid; place-items: center; color: #fff; }
.red-ico svg { width: 26px; height: 26px; }
.red-facebook .red-ico { background: #1877f2; }
.red-instagram .red-ico { background: radial-gradient(circle at 30% 107%, #fdf497 0%, #fdf497 5%, #fd5949 45%, #d6249f 60%, #285aeb 90%); }
.red-txt { display: flex; flex-direction: column; min-width: 0; }
.red-txt small { font-size: .72rem; color: var(--gris); font-weight: 600; text-transform: uppercase; letter-spacing: .08em; }
.red-txt b { font-size: .98rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.red-accion { font-family: var(--titular); font-weight: 800; text-transform: uppercase; letter-spacing: .06em; font-size: .86rem; padding: 7px 12px; border-radius: 99px; background: var(--azul); color: #fff; white-space: nowrap; }
.red-facebook .red-accion { background: #1877f2; }
.red-instagram .red-accion { background: #d6249f; }
.pie-redes { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; margin-top: 12px !important; }
.pie-redes > span { font-family: var(--titular); font-weight: 800; letter-spacing: .14em; text-transform: uppercase; font-size: .8rem; color: var(--plata-osc); }
.pie-red { display: inline-flex; align-items: center; gap: 7px; padding: 6px 12px 6px 8px; border-radius: 99px; background: rgba(255,255,255,.08); color: #fff; text-decoration: none; font-weight: 600; font-size: .85rem; transition: background .2s; }
.pie-red svg { width: 18px; height: 18px; }
.pie-facebook:hover { background: #1877f2; }
.pie-instagram:hover { background: #d6249f; }
@media (max-width: 760px) {
  .redes { grid-template-columns: 1fr; padding: 18px 16px; }
  .red-accion { padding: 6px 10px; font-size: .78rem; }
}
@media (max-width: 380px) { .red-accion { display: none; } .red-btn { grid-template-columns: 44px minmax(0, 1fr); } }
.red-txt b { white-space: normal; overflow: visible; text-overflow: clip; overflow-wrap: anywhere; line-height: 1.2; }
.redes { grid-template-columns: minmax(0, 1fr) minmax(0, 1.4fr); }
@media (max-width: 760px) { .redes { grid-template-columns: 1fr; } }
@media (max-width: 760px) { .red-txt b { font-size: .9rem; } .red-btn { gap: 10px; } .red-accion { padding: 6px 9px; } }

/* ---------- Barra lateral de redes (en todas las pestañas) ---------- */
.redes-lateral {
  position: fixed; z-index: 55; left: 0; top: 50%; transform: translateY(-50%);
  display: flex; flex-direction: column; align-items: center; gap: 8px;
  padding: 12px 8px 10px 7px; background: var(--azul);
  border-radius: 0 10px 10px 0; border: 2px solid var(--oro); border-left: 0;
  box-shadow: 0 10px 26px rgba(8, 24, 46, .32);
}
.rl-titulo {
  writing-mode: vertical-rl; transform: rotate(180deg);
  font-family: var(--titular); font-weight: 800; font-size: .74rem; letter-spacing: .24em; text-transform: uppercase;
  color: var(--oro); margin-bottom: 4px;
}
.rl-btn { position: relative; display: block; text-decoration: none; }
.rl-ico { width: 40px; height: 40px; border-radius: 10px; display: grid; place-items: center; color: #fff; transition: transform .2s; }
.rl-ico svg { width: 23px; height: 23px; }
.rl-facebook .rl-ico { background: #1877f2; }
.rl-instagram .rl-ico { background: radial-gradient(circle at 30% 107%, #fdf497 0%, #fdf497 5%, #fd5949 45%, #d6249f 60%, #285aeb 90%); }
.rl-btn:hover .rl-ico, .rl-btn:focus-visible .rl-ico { transform: scale(1.08); }
.rl-btn:focus-visible { outline: 3px solid var(--oro); outline-offset: 3px; border-radius: 12px; }
.rl-tip {
  position: absolute; left: calc(100% + 16px); top: 50%; transform: translate(-6px, -50%);
  display: flex; flex-direction: column; white-space: nowrap; pointer-events: none;
  background: #fff; color: var(--tinta); padding: 7px 12px; border-radius: 8px;
  box-shadow: 0 8px 20px rgba(8, 24, 46, .25); opacity: 0; transition: opacity .18s, transform .18s;
}
.rl-tip::before { content: ""; position: absolute; left: -6px; top: 50%; margin-top: -6px; border: 6px solid transparent; border-left: 0; border-right-color: #fff; }
.rl-tip small { font-size: .68rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--gris); }
.rl-tip b { font-size: .9rem; }
.rl-btn:hover .rl-tip, .rl-btn:focus-visible .rl-tip { opacity: 1; transform: translate(0, -50%); }
.rl-asa { display: none; }
/* Pantallas medianas y celulares: pestañita en el borde izquierdo (sobre el botón de música); al tocarla salen los botones */
@media (max-width: 1139px) {
  .redes-lateral {
    top: auto; left: 0; bottom: calc(max(14px, env(safe-area-inset-bottom)) + 4px);
    padding: 7px 7px 7px 6px; gap: 7px; border-radius: 0 12px 12px 0;
    transform: translateX(-100%); transition: transform .28s cubic-bezier(.2,.8,.2,1);
  }
  body.con-boton-musica .redes-lateral { bottom: calc(max(14px, env(safe-area-inset-bottom)) + 62px); }
  .redes-lateral.abierta { transform: translateX(0); }
  .rl-titulo, .rl-tip { display: none; }
  .rl-ico { width: 38px; height: 38px; border-radius: 50%; }
  .rl-ico svg { width: 21px; height: 21px; }
  .rl-asa {
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
    position: absolute; left: calc(100% + 2px); bottom: 10px;
    width: 28px; padding: 9px 0; border: 2px solid var(--oro); border-left: 0; border-radius: 0 10px 10px 0;
    background: var(--azul); color: #fff; cursor: pointer; box-shadow: 4px 6px 16px rgba(8, 24, 46, .3);
  }
  .rl-asa-ico { display: grid; place-items: center; }
  .rl-asa-ico svg { width: 15px; height: 15px; }
  .rl-asa:focus-visible { outline: 3px solid #fff; outline-offset: 2px; }
  .redes-lateral.abierta .rl-asa { opacity: 0; pointer-events: none; }
}
@media (max-width: 1139px) and (prefers-reduced-motion: reduce) { .redes-lateral { transition: none; } }
@media print { .redes-lateral { display: none; } }

      <h2>Bases y Reglamento del Torneo</h2>
      <p class="muted" id="reg-sub">REDDFUT Usulután · Torneo Apertura: Liga Especial de Escuelas de Fútbol</p>

      <h3>1. Presentación</h3>
      <p>El presente documento establece las normas y lineamientos bajo los cuales se regirá el torneo oficial de las escuelas de fútbol pertenecientes a REDDFUT Usulután. Este certamen tiene como objetivo principal fomentar el desarrollo deportivo, el espíritu de competencia sana y la convivencia entre las diversas comunidades del departamento.</p>

      <h3>2. Categorías y niveles de participación</h3>
      <p>El torneo se dividirá en cinco categorías según las edades de los atletas, asegurando una competencia justa y acorde al desarrollo físico de cada grupo:</p>
      <ul class="chips-lista">
        <li>Sub-7</li><li>Sub-9</li><li>Sub-13</li><li>Sub-15</li><li>Sub-17</li>
      </ul>

      <h3>3. Sistema de competencia</h3>
      <p>El torneo se desarrollará en dos etapas principales para definir al campeón de cada categoría:</p>
      <div class="fases">
        <div class="fase">
          <span class="fase-num">Fase I</span>
          <h4>Temporada regular (liga)</h4>
          <ul>
            <li><b>Participantes:</b> 14 escuelas de fútbol.</li>
            <li><b>Formato:</b> todos contra todos a una sola vuelta. Cada equipo disputará un total de 13 jornadas.</li>
            <li><b>Puntuación:</b> 3 puntos por victoria, 1 por empate y 0 por derrota.</li>
            <li><b>Clasificación:</b> los equipos ubicados en las primeras 8 posiciones de la tabla general avanzan a la siguiente ronda.</li>
          </ul>
        </div>
        <div class="fase">
          <span class="fase-num">Fase II</span>
          <h4>Eliminación directa (playoffs)</h4>
          <p>Los 8 clasificados se enfrentan en llaves de eliminación directa según su posición en la tabla (1º vs 8º, 2º vs 7º, etc.):</p>
          <ul>
            <li><b>Cuartos de final:</b> 8 equipos buscando el pase a la siguiente ronda.</li>
            <li><b>Semifinales:</b> los 4 ganadores de la fase anterior.</li>
            <li><b>Gran final:</b> disputa por el título entre los dos mejores equipos del torneo.</li>
          </ul>
        </div>
      </div>

      <h3>4. Objetivo del torneo</h3>
      <p>Más allá de la competencia, se busca que cada jornada sea una fiesta deportiva en Usulután, donde impere el respeto a los árbitros, rivales y la formación integral de nuestros jóvenes talentos.</p>
    </article>

  <script>

  /* ------------------------------------------------------------------ */
  /* Configuración básica                                               */
  /* ------------------------------------------------------------------ */

  const NJ = T.totalJornadas || Math.max(1, (T.escuelas || []).length - 1);
  const NCLAS = T.clasificados || 8;
  const JORNADAS = [...(T.jornadas || [])].sort((a, b) => a.numero - b.numero);
  const PALETA = ["#0b6e3f", "#13315c", "#b45309", "#7c3aed", "#be123c", "#0e7490", "#4d7c0f",
    "#9d174d", "#1d4ed8", "#a16207", "#0f766e", "#6d28d9", "#c2410c", "#334155"];

  const ESCUELAS = new Map();
  (T.escuelas || []).forEach((e, i) => {
    ESCUELAS.set(e.nombre, {
      nombre: e.nombre,
      corto: e.corto || siglas(e.nombre),
      color: e.color || PALETA[i % PALETA.length],
      sinCategorias: e.sinCategorias || []

  const store = {
    get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },

  };

  const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g,
    (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

  function siglas(nombre) {
    const limpio = nombre.replace(/^(E\.?\s*F\.?|Escuela( de)? F[uú]tbol|Academia)\s*/i, "").trim();
    const palabras = limpio.split(/\s+/).filter((w) => /^[A-ZÁÉÍÓÚÑ0-9]/.test(w));
    if (palabras.length >= 2) return palabras.slice(0, 3).map((w) => w[0]).join("").toUpperCase();
    return (palabras[0] || limpio).slice(0, 3).toUpperCase();

  function fecha(f, opciones) {

    if (!m) return { texto: s };
    return {
      gl: +m[1], gv: +m[2],
      pl: m[3] != null ? +m[3] : null,

  /* Escudos oficiales: una regla CSS por escuela (la imagen se carga una sola vez) */

  function escudo(nombre, grande) {

    if (LOGOS.has(nombre)) return `<span class="escudo con-logo ${LOGOS.get(nombre)}${grande ? " grande" : ""}" role="img" aria-label="Escudo de ${esc(nombre)}"></span>`;
    return `<span class="escudo${grande ? " grande" : ""}" style="background:${esc(e.color)}" aria-hidden="true">${esc(e.corto)}</span>`;
  }

  /* ------------------------------------------------------------------ */
  /* Validación de datos (ayuda a quien edita datos.js)                 */
  /* ------------------------------------------------------------------ */
  const errores = [];
  (function validar() {
    if (ESCUELAS.size !== (T.escuelas || []).length) errores.push("Hay escuelas repetidas en la lista de escuelas.");
    const cruces = new Map();
    JORNADAS.forEach((j) => {
      const vistos = new Set();
      (j.partidos || []).forEach((p) => {
        [p.local, p.visitante].forEach((n) => {
          if (!ESCUELAS.has(n)) errores.push(`Jornada ${j.numero}: la escuela "${n}" no está escrita igual que en la lista de escuelas.`);
          else if (vistos.has(n)) errores.push(`Jornada ${j.numero}: "${n}" aparece en más de un partido.`);
          vistos.add(n);
        });
        const clave = [p.local, p.visitante].sort().join(" | ");
        if (cruces.has(clave)) errores.push(`"${p.local}" vs "${p.visitante}" aparece en la jornada ${cruces.get(clave)} y en la ${j.numero}.`);
        else cruces.set(clave, j.numero);
        Object.keys(p.resultados || {}).forEach((c) => {
          if (!CATS.includes(c)) errores.push(`Jornada ${j.numero} (${p.local} vs ${p.visitante}): categoría desconocida "${c}".`);
        });
      });
    });
    (T.ajustes || []).forEach((a) => {
      if (!ESCUELAS.has(a.escuela)) errores.push(`Ajuste de puntos: la escuela "${a.escuela}" no existe.`);
    });
  })();

  /* ------------------------------------------------------------------ */
  /* Cálculos                                                           */
  /* ------------------------------------------------------------------ */
  function calcularTabla(cat) {
    const filas = [...ESCUELAS.values()].filter((e) => !e.sinCategorias.includes(cat)).map((e) => ({
      nombre: e.nombre, pj: 0, g: 0, e: 0, p: 0, gf: 0, gc: 0, ajuste: 0, motivos: [], forma: []
    }));
    const por = new Map(filas.map((f) => [f.nombre, f]));

    JORNADAS.forEach((j) => (j.partidos || []).forEach((p) => {
      const r = parseRes(p.resultados && p.resultados[cat]);
      if (!r || r.gl == null) return;
      const L = por.get(p.local), V = por.get(p.visitante);
      if (!L || !V) return;
      L.pj++; V.pj++;
      L.gf += r.gl; L.gc += r.gv; V.gf += r.gv; V.gc += r.gl;
      if (r.gl > r.gv) { L.g++; V.p++; L.forma.push("G"); V.forma.push("P"); }
      else if (r.gl < r.gv) { V.g++; L.p++; V.forma.push("G"); L.forma.push("P"); }
      else { L.e++; V.e++; L.forma.push("E"); V.forma.push("E"); }
    }));

    (T.ajustes || []).forEach((a) => {
      if (a.categoria !== cat && a.categoria !== "Todas") return;
      const f = por.get(a.escuela);
      if (f) { f.ajuste += Number(a.puntos) || 0; if (a.mostrarNota !== false) f.motivos.push(a); }
    });

    filas.forEach((f) => { f.dg = f.gf - f.gc; f.pts = f.g * 3 + f.e + f.ajuste; });
    filas.sort((a, b) => b.pts - a.pts || b.dg - a.dg || b.gf - a.gf || a.nombre.localeCompare(b.nombre, "es"));
    return filas;
  }

  function jornadaActual() {

    JORNADAS.forEach((j) => {
      const conRes = (j.partidos || []).some((p) => CATS.some((c) => {
        const r = parseRes(p.resultados && p.resultados[c]);
        return r && r.gl != null;
      }));
      if (conRes) ult = Math.max(ult, j.numero);
    });
    return ult;
  }

  const LLAVES = [
    { id: "C1", ronda: 0, seeds: [1, 8] },
    { id: "C2", ronda: 0, seeds: [4, 5] },
    { id: "C3", ronda: 0, seeds: [2, 7] },
    { id: "C4", ronda: 0, seeds: [3, 6] },
    { id: "S1", ronda: 1, de: ["C1", "C2"] },
    { id: "S2", ronda: 1, de: ["C3", "C4"] },
    { id: "F", ronda: 2, de: ["S1", "S2"] }
  ];
  const NOMBRE_LLAVE = { C1: "Cuartos 1", C2: "Cuartos 2", C3: "Cuartos 3", C4: "Cuartos 4", S1: "Semifinal 1", S2: "Semifinal 2", F: "Gran Final" };

  function calcularPlayoffs(cat) {
    const tabla = calcularTabla(cat);
    const completa = JA >= NJ;
    const datos = (T.playoffs && T.playoffs[cat]) || {};
    const res = {};
    LLAVES.forEach((l) => {
      let d = datos[l.id];
      if (typeof d === "string") d = { resultado: d };
      d = d || {};
      let local, visitante, etL, etV;
      if (l.seeds) {
        local = d.local || (tabla[l.seeds[0] - 1] || {}).nombre;
        visitante = d.visitante || (tabla[l.seeds[1] - 1] || {}).nombre;
        etL = l.seeds[0] + "º"; etV = l.seeds[1] + "º";
      } else {
        local = d.local || res[l.de[0]].ganador;
        visitante = d.visitante || res[l.de[1]].ganador;
        etL = ""; etV = "";
      }
      const r = parseRes(d.resultado);
      let ganador = null;
      if (r && r.gl != null && local && visitante) {
        if (r.gl > r.gv) ganador = local;
        else if (r.gv > r.gl) ganador = visitante;
        else if (r.pl != null && r.pl !== r.pv) ganador = r.pl > r.pv ? local : visitante;
      }
      res[l.id] = Object.assign({}, l, { local, visitante, etL, etV, r, ganador, fecha: d.fecha, cancha: d.cancha });
    });
    return { res, completa, tabla };
  }

  const TABS = ["inicio", "posiciones", "resultados", "canchas", "playoffs", "reglamento"].concat(QUINIELA_ACTIVA ? ["quiniela"] : []);
  const JA = jornadaActual();

    document.getElementById("nombre-torneo").innerHTML =
      `${esc(l1)} <span class="l2">${esc(l2)}${mN ? ` <span class="anio">${esc(mN[2])}</span>` : ""}</span>`;
    document.getElementById("pie-org").textContent = T.organizador || "";

  function renderNav() {

      b.setAttribute("aria-selected", b.dataset.tab === estado.tab ? "true" : "false");
    });
    const sel = document.querySelector('#tabs button[aria-selected="true"]'), cont = document.getElementById("tabs");
    if (sel && cont.scrollWidth > cont.clientWidth) cont.scrollTo({ left: sel.offsetLeft - (cont.clientWidth - sel.offsetWidth) / 2, behavior: "auto" });
    const cats = document.getElementById("cats");
    document.getElementById("barra-cats").classList.toggle("oculto", ["reglamento", "inicio", "quiniela", "canchas"].includes(estado.tab));

  /* ------------------------------------------------------------------ */
  /* Render: Posiciones                                                 */
  /* ------------------------------------------------------------------ */
  function renderPosiciones() {
    const tabla = calcularTabla(estado.cat);
    const conAjuste = tabla.filter((f) => f.ajuste && f.motivos.length);
    const filas = tabla.map((f, i) => {
      const pos = i + 1;
      const cls = [pos <= NCLAS ? "clasifica" : "", pos === NCLAS ? "corte" : ""].join(" ");
      const forma = f.forma.slice(-5).map((x) => `<i class="${x}" title="${{ G: "Ganó", E: "Empató", P: "Perdió" }[x]}">${x}</i>`).join("");
      return `<tr class="${cls}">
        <td class="pos">${pos}</td>
        <td class="izq"><div class="equipo-celda">${escudo(f.nombre)}<span class="n" title="${esc(f.nombre)}">${esc(f.nombre)}</span></div></td>

        <td>${f.dg > 0 ? "+" + f.dg : f.dg}</td>
        <td class="pts">${f.pts}${f.ajuste && f.motivos.length ? `<span class="ajuste">*</span>` : ""}</td>
        <td class="opt2">${forma ? `<span class="forma">${forma}</span>` : "–"}</td>
      </tr>`;
    }).join("");

    app.innerHTML = `
      <div class="seccion-titulo">
        <h2>Posiciones <span class="cat">${esc(estado.cat)}</span></h2>
        <span class="muted">${JA ? `Tras la jornada ${JA}` : "Aún no hay partidos jugados"}</span>
      </div>
      <div class="tarjeta">
        <div class="tabla-wrap">
          <table class="tabla">
            <thead><tr>
              <th>#</th><th class="izq">Escuela</th><th title="Partidos jugados">PJ</th>
              <th class="opt" title="Ganados">G</th><th class="opt" title="Empatados">E</th><th class="opt" title="Perdidos">P</th>
              <th class="opt" title="Goles a favor">GF</th><th class="opt" title="Goles en contra">GC</th>
              <th title="Diferencia de goles">DG</th><th class="th-pts" title="Puntos">Pts</th><th class="opt2">Últimos</th>
            </tr></thead>
            <tbody>${filas}</tbody>
          </table>
        </div>
        ${conAjuste.length ? `<p class="notas-ajustes">${conAjuste.map((f) => f.motivos.map((m) =>
          `* ${esc(f.nombre)}: ${m.puntos > 0 ? "+" : ""}${m.puntos} pts${m.motivo ? " (" + esc(m.motivo) + ")" : ""}`).join("<br>")).join("<br>")}</p>` : ""}
        <div class="leyenda">

  /* ------------------------------------------------------------------ */
  /* Render: Resultados                                                 */
  /* ------------------------------------------------------------------ */
  function marcadorHTML(r, jugado) {
    if (!r) return jugado ? `<div class="marcador pendiente" title="Esta categoría no tiene resultado en este partido">SIN<br>PARTIDO</div>` : `<div class="marcador pendiente">VS</div>`;

  function renderResultados() {

    const botones = Array.from({ length: NJ }, (_, i) => i + 1).map((n) =>
      `<button data-jornada="${n}" aria-pressed="${n === estado.jornada}" class="${disponibles.has(n) ? "" : "sin-datos"}" title="Jornada ${n}">${n}</button>`
    ).join("");

    } else {
      const sinJugar = !j.partidos.some((p) => CATS.some((c) => parseRes(p.resultados && p.resultados[c])));

        ? (P.modo === "vivo" ? `<div class="mini-cuenta vivo"><i></i>Se está jugando hoy</div>`

        const r = parseRes(p.resultados && p.resultados[estado.cat]);

        if (r && r.gl != null) {

  /* ------------------------------------------------------------------ */

  function llaveHTML(l) {

  function renderPlayoffs() {

  /* ------------------------------------------------------------------ */
  /* Render: Inicio (portada)                                           */
  /* ------------------------------------------------------------------ */
  /* ---------- Contador en tiempo real hacia la próxima jornada ---------- */
  const esHora = (h) => /^\d{1,2}:\d{2}$/.test(h || "");
  const minutos = (h) => { const [a, b] = h.split(":"); return +a * 60 + +b; };
  const HORARIOS = CATS.filter((c) => T.horarios && esHora(T.horarios[c])).map((c) => ({ c, h: T.horarios[c] }));
  const horaDe = (c) => (HORARIOS.find((x) => x.c === c) || {}).h || null;
  /* Turnos: categorías agrupadas por hora (las de la misma hora juegan a la vez) */
  const TURNOS = [...new Set(HORARIOS.map((x) => x.h))].sort((a, b) => minutos(a) - minutos(b))
    .map((h) => ({ h, cats: HORARIOS.filter((x) => x.h === h).map((x) => x.c) }));
  const HORA_JUEGOS = TURNOS.length ? TURNOS[0].h : (esHora(T.horaJuegos) ? T.horaJuegos : "08:00");
  /* Se da por terminada la mañana ~80 min después del último turno */
  const FIN_JUEGOS_MS = ((TURNOS.length ? minutos(TURNOS[TURNOS.length - 1].h) - minutos(HORA_JUEGOS) : 240) + 80) * 60e3;
  function momento(fechaISO, h) {
    const [a, b] = h.split(":");
    const d = new Date(`${fechaISO}T${a.padStart(2, "0")}:${b}:00-06:00`);   // hora de El Salvador
    return isNaN(d) ? null : d.getTime();
  }
  function inicioJornada(j) { return j && j.fecha ? momento(j.fecha, HORA_JUEGOS) : null; }
  const horaTxt = (h) => { const [a, b] = h.split(":").map(Number); return `${((a + 11) % 12) + 1}:${String(b).padStart(2, "0")}\u00a0${a < 12 ? "a.\u00a0m." : "p.\u00a0m."}`; };
  function turnosHTML(j, ahora = Date.now()) {
    if (!TURNOS.length) return "";
    const enVivo = ahora >= inicioJornada(j);
    const sig = enVivo ? TURNOS.find((t) => momento(j.fecha, t.h) > ahora) : null;
    return `<div class="cuenta-turnos">${TURNOS.map((t) => {
      const ini = momento(j.fecha, t.h);
      const est = !enVivo ? "" : ini <= ahora ? "ya" : t === sig ? "sig" : "";
      const etq = est === "ya" ? "✓ Ya empezó" : est === "sig" ? `Empieza en <b data-cuenta-corta="${ini}"></b>` : "";
      return `<div class="turno ${est}"><span class="t-hora">${horaTxt(t.h)}</span><span class="t-cats">${t.cats.map(esc).join(" · ")}</span>${etq ? `<span class="t-est">${etq}</span>` : ""}</div>`;
    }).join("")}</div>`;
  }
  function tieneResultados(j) {
    return (j.partidos || []).some((p) => CATS.some((c) => parseRes(p.resultados && p.resultados[c])));
  }
  /* Qué toca ahora: "cuenta" (falta para la próxima), "vivo" (se está jugando hoy) o null */
  function proximaJornada(ahora = Date.now()) {
    const pend = JORNADAS.filter((j) => (j.partidos || []).length && !tieneResultados(j) && inicioJornada(j));
    const vivo = pend.find((j) => ahora >= inicioJornada(j) && ahora < inicioJornada(j) + FIN_JUEGOS_MS);
    if (vivo) return { modo: "vivo", j: vivo, t: inicioJornada(vivo) };
    const prox = pend.find((j) => inicioJornada(j) > ahora);
    const sinRes = pend.filter((j) => inicioJornada(j) + FIN_JUEGOS_MS <= ahora).map((j) => j.numero);
    return prox ? { modo: "cuenta", j: prox, t: inicioJornada(prox), sinRes } : (sinRes.length ? { modo: "espera", sinRes } : null);
  }
  function partesCuenta(ms) {
    const s = Math.max(0, Math.floor(ms / 1000));
    return { d: Math.floor(s / 86400), h: Math.floor(s / 3600) % 24, m: Math.floor(s / 60) % 60, s: s % 60 };
  }
  const dos2 = (n) => String(n).padStart(2, "0");
  function cuentaHTML() {
    const P = proximaJornada();
    if (!P) return "";
    const listaSinRes = P.sinRes && P.sinRes.length
      ? `<p class="cuenta-nota">✅ ${P.sinRes.length > 1 ? "Jornadas" : "Jornada"} ${P.sinRes.join(", ")} ya ${P.sinRes.length > 1 ? "se jugaron" : "se jugó"} · los resultados se publicarán pronto.</p>` : "";
    if (P.modo === "espera") return `<section class="cuenta cuenta-espera">${listaSinRes}</section>`;
    const j = P.j;
    const dia = fecha(j.fecha, { weekday: "long", day: "numeric", month: "long" });
    const hora = new Date(P.t).toLocaleTimeString("es-SV", { hour: "numeric", minute: "2-digit", timeZone: "America/El_Salvador" }).replace(/\s/g, "\u00a0");
    const cruces = j.partidos.map((p) => `<span class="cuenta-cruce" title="${esc(p.local)} vs ${esc(p.visitante)}${p.cancha ? " · " + esc(p.cancha) : ""}">${escudo(p.local)}<i>vs</i>${escudo(p.visitante)}</span>`).join("");
    const reloj = P.modo === "vivo"
      ? `<div class="cuenta-vivo"><span class="punto"></span><b>Se está jugando hoy</b></div>`
      : (() => { const c = partesCuenta(P.t - Date.now()); return `<div class="cuenta-reloj" data-cuenta="${P.t}" role="timer" aria-live="off">
          ${[["d", "Días"], ["h", "Horas"], ["m", "Min"], ["s", "Seg"]].map(([k, t]) => `<div class="dig"><b data-k="${k}">${k === "d" ? c[k] : dos2(c[k])}</b><span>${t}</span></div>`).join("")}
        </div>`; })();
    return `<section class="cuenta ${P.modo === "vivo" ? "en-vivo" : ""}">
      <div class="cuenta-cab">
        <span class="cuenta-tit">${P.modo === "vivo" ? "En juego" : "Próxima jornada"}</span>
        <span class="cuenta-num">J${dos2(j.numero)}</span>
      </div>
      ${reloj}

      ${listaSinRes}

  }
  /* Un solo reloj para todo el sitio: actualiza los números cada segundo */
  function claveCuenta(ahora) {
    const P0 = proximaJornada(ahora);
    const turno = P0 && P0.modo === "vivo" ? TURNOS.filter((t) => momento(P0.j.fecha, t.h) <= ahora).length : -1;
    const q = QUINIELA_ACTIVA ? quinielaAhora(ahora) : null;
    return JSON.stringify(P0) + "|" + turno + "|" + (q ? q.j.numero + (q.abierta ? "a" : "c") : "");
  }
  let modoCuenta = claveCuenta(Date.now());
  function tic() {
    const ahora = Date.now();
    document.querySelectorAll("[data-cuenta]").forEach((el) => {
      const c = partesCuenta(+el.dataset.cuenta - ahora);
      el.querySelectorAll("b[data-k]").forEach((b) => {
        const v = b.dataset.k === "d" ? String(c.d) : dos2(c[b.dataset.k]);
        if (b.textContent !== v) b.textContent = v;
      });
    });
    document.querySelectorAll("[data-cuenta-corta]").forEach((el) => {
      const c = partesCuenta(+el.dataset.cuentaCorta - ahora);
      const v = c.d ? `${c.d}d ${dos2(c.h)}h ${dos2(c.m)}m` : `${dos2(c.h)}:${dos2(c.m)}:${dos2(c.s)}`;
      if (el.textContent !== v) el.textContent = v;
    });
    const m = claveCuenta(ahora);   // llegó la hora: cambia a "en juego", al siguiente turno, etc.
    if (m !== modoCuenta) { modoCuenta = m; renderCabecera(); if (estado.tab === "inicio" || estado.tab === "resultados") render(); }
  }
  setInterval(tic, 1000);

  /* Ventana de la quiniela de cada jornada (igual que quiniela.js):
     abre "diasAntes" días antes del primer partido y cierra el día de juego a la horaCierre. */
  function ventanaQuiniela(j) {
    if (!j || !j.fecha) return null;
    const dias = Number.isFinite(Number(Q && Q.diasAntes)) ? Number(Q.diasAntes) : 2;
    const hc = (j.cierre && String(j.cierre).match(/(\d{1,2}:\d{2})$/)) ? String(j.cierre).match(/(\d{1,2}:\d{2})$/)[1] : ((Q && Q.horaCierre) || "07:00");
    const cierre = momento(j.cierre ? String(j.cierre).slice(0, 10) : j.fecha, hc);
    const apertura = j.apertura ? momento(String(j.apertura).slice(0, 10), String(j.apertura).slice(11, 16) || HORA_JUEGOS)
      : momento(j.fecha, HORA_JUEGOS) - dias * 864e5;
    return cierre && apertura ? { apertura, cierre } : null;
  }
  function quinielaAhora(ahora = Date.now()) {
    for (const j of JORNADAS) {
      if (!(j.partidos || []).length || tieneResultados(j)) continue;
      const v = ventanaQuiniela(j);
      if (!v || v.cierre <= ahora) continue;
      return { j, ...v, abierta: ahora >= v.apertura };
    }
    return null;
  }
  function promoQuiniela() {
    if (!QUINIELA_ACTIVA) return "";
    const q = quinielaAhora();
    const fechaHora = (ms) => new Date(ms).toLocaleString("es-SV", { weekday: "long", day: "numeric", month: "short", hour: "numeric", minute: "2-digit", timeZone: "America/El_Salvador" });
    let tit = "Quiniela del torneo", txt = "Adivina los resultados de cada jornada y compite en la tabla. Solo por diversión.", ir = "Ver tabla ›";
    if (q && q.abierta) {

  /* Avisos: "te avisamos cuando se actualicen las tablas" (nunca se piden solos) */
  const avisosUI = { cargando: false, msg: "", ok: false };
  function avisosEstado() {
    const local = !!window.MODO_OFFLINE || location.protocol === "file:";
    if (local || !QUINIELA_ACTIVA || !("serviceWorker" in navigator)) return "no";
    const ios = /iphone|ipad|ipod/i.test(navigator.userAgent);
    const instalada = (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches) || navigator.standalone;
    if (ios && !instalada && !("PushManager" in window)) return "ios";
    if (typeof Notification === "undefined" || !("PushManager" in window)) return "no";
    if (Notification.permission === "denied") return "bloqueado";
    let token = null;

    return token && Notification.permission === "granted" ? "activos" : "apagados";
  }

      <span class="av-txt"><b>${t}</b><span>${avisosUI.msg ? esc(avisosUI.msg) : d}</span></span>
